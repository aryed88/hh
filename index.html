  "def": "1966年2月“文化革命五人小组”向中共中央呈递的汇报文件。即《关于当前学术讨论的汇报提纲》。1965年11月姚文元发表《评新编历史剧<海瑞罢官〉》,在社会上、文艺界引起很大的混乱。1966年2月3日，“文化革命五人小组”研究关于当前学术讨论的问题，拟订了一个汇报提纲。提纲要求坚持实事求是、在真理面前人人平等的原则，试图对学术讨论中出现的“左”倾偏向适当地加以限制。不久，中央批发了《二月提纲》。5月“五一六通知”将其推翻，随后展开“文革”。",

  "def": "1966年5月28日成立的“文化大革命”实际指挥机构。1966年5月在北京召开的中共中央政治局扩大会议决定撤销以彭真为首的“文化革命五人小组”,重新设立“文化革命小组”(又称“中央文革小组”),隶属政治局常委之下。组长陈伯达，顾问康生，副组长江青、张春桥等人，成员有王力、关锋、戚本禹、姚文元等人。该小组掌握了很大一部分中央权力，逐步取代了中央政治局和中央书记处，实际上是“文化大革命”的指挥部。为发动“文化大革命”做了组织上的准备。1969年撤销。",

  "def": "1966年5月7日毛泽东写给林彪的批示信。毛泽东看了解放军总后勤部《关于进一步搞好部队农副生产的报告》后，给林彪写了一封关于部队农副业生产报告的指示信。主要内容是：军队要学习地方，学政治、学军事、学文化，又能从事农副生产，又能办一些小工厂，又能从事群众工作，使军民打成一片；同时地方也要学习解放军，以一项为主，兼学别样等。商业、服务行业、党政机关工作人员，凡有条件的也要这样做。“五七指示”在“文化大革命”中成为办学方针，造成了教育教学制度和秩序的混乱。",

 {

  "alias": "简称“文革”",
  "def": "1966—1976年，由领导人错误发动，被林彪、江青两个反革命集团利用，给党、国家和各族人民带来严重灾难的内乱。其指导思想是“无产阶级专政下继续革命的理论”。其过程分为三个阶段：从1966年5月中央政治局扩大会议开始发动到1969年4月党的九大；从党的九大到1973年8月党的十大；从党的十大到1976年10月以粉碎“四人帮”为标志，宣告“文化大革命”结束。1981年6月党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》,对“文化大革命”做了正确的总结。",

  "def": "“文革”时期的一次全国性青年学生运动。1966年5月下旬北京青少年首先发起了“保卫毛主席”和“反修防修”的红卫兵运动。8月1日毛泽东复信支持清华附中红卫兵及其造反行动，运动遂在全国广泛开展起来。9月全国各地师生在“停课闹革命”的口号下开始了全国大串联。从8月到11月，毛泽东在北京天安门城楼上佩戴红卫兵袖章，先后8次接见来自全国各地的1300余万师生和红卫兵。运动造成了全国性的大动乱。1968年底以后，随着上山下乡运动的开展，红卫兵组织名存实亡。",

  "alias": "",
  "def": "1967年1月张春桥、姚文元伙同王洪文等发动的向上海市党政领导机关夺权的严重政治事件。1967年1月4日和5日，上海“造反派”相继夺了《文汇报》和《解放日报》的权。6日32个“造反”组织联合召开“彻底打倒以陈丕显、曹荻秋为首的上海市委大会”。批斗了上海市委主要负责人。会后，上海市委、市政府、市人大所有机构被迫停止办公。毛泽东对上海“造反派”的夺权给予肯定。从而引发了从中央各部门到中央各级党政机关乃至各行各业的全面夺权风暴。",

  "def": "1974年江青等人借助风庆轮远航成功而制造的事件。风庆轮是江南造船厂建造的一艘万吨级货轮，曾航行地中海和欧洲的一些国家。1974年“四人帮”利用风庆轮远航成功，以歌颂自力更生为幌子，大批所谓“崇洋媚外”思想，矛头直指周恩来和邓小平。10月毛泽东批评了江青，事态没有进一步扩大。江青等人制造该事件的目的是阻挠周、邓主持工作，从而实现他们组阁的计划。这次阴谋被挫败，为以后的国民经济整顿工作创造了有利条件。",

  "def": "“文化大革命”后期开展的所谓反击右倾翻案风的批判邓小平的运动。邓小平对各条战线的整顿，是对“文革”以来一些错误政策比较系统的纠正，为毛泽东所不能容忍。1975年9月底毛泽东决定发动所谓“批邓、反击右倾翻案风”运动。“四人帮”污蔑邓小平于1975年主持下的全面整顿工作和中央、国务院采取的各项政策、措施是一股“右倾翻案风”,并借机进行篡党夺权活动。这使全国再度陷入混乱，把刚刚恢复发展的国民经济再度推向停滞、倒退。",

  "alias": "",
  "def": "粉碎“四人帮”后中共中央主席华国锋提出和实行的错误方针。1977年2月7日，华国锋指示《人民日报》、《红旗》杂志、《解放军报》发表题为《学好文件抓住纲》的社论，提出“凡是毛主席做出的决策，我们都坚决维护，凡是毛主席的指示，我们都始终不渝地遵循”。此方针严重阻碍了拨乱反正的进行，个人迷信也得不到破除。1978年党的十一届三中全会纠正了“两个凡是”的错误方针，高度评价实践是检验真理的唯一标准问题的讨论，恢复了党的马克思主义路线。",

  "def": "1978年5月11日《光明日报》以特约评论员名义刊登的文章。原刊于5月10日中共中央党校《理论动态》,文章初稿作者是南京大学哲学系教师胡福明。文章指出：检验真理的标准只能是社会实践，任何理论都要不断接受实践的检验。文章发表当天，新华社及时作了转发，《人民日报》《解放军报》同时转载，全国绝大多数省、自治区的报纸也陆续转载。这篇文章从根本理论上对“两个凡是”的否定，在全党和全国引起了强烈反响，由此开始了全国范围内的真理标准大讨论，成为新的思想解放运动的先导。",

  "def": "1981年中共中央通过的关于党史问题的决议。1981年6月27日，中国共产党第十一届中央委员会第六次全体会议一致通过该决议。该决议对共和国建立以来的一系列重大历史事件，特别是“文化大革命”做出了全面总结；对这一时期一些重要历史人物的功过，特别是毛泽东的历史地位，做出了实事求是的基本评价。该决议和1945年的《关于若干历史问题的决议》一起，被认为是中国共产党建党以来两个最为重要、最为权威的内部历史文献，都起到了对有争议的党内历史问题做出结论、全面总结党的历史经验等一系列作用。",

  "term": "家庭联产承包责任制",
  "alias": "",
  "def": "1978年开始在农村实行的联产到人、包干到户等多种形式的农业生产责任制。家庭联产承包责任制较之农村原来的生产管理方式，最显著的特点是：明确划分了国家、集体和个人的权利、责任和利益关系，克服了平均主义的弊端，其经营收入除按合同规定上缴一小部分给集体及缴纳国家税金，剩下的全部归于农户，因此有效地调动了广大农民的生产积极性，适应并促进了农村社会生产力的发展。家庭联产承包责任制实行以来，农业生产和农民生活得到了巨大改善。",

  "term": "价格双轨制",
  "alias": "又称双轨制价格",
  "def": "改革开放初期国家计划价格与市场价格同时并存的一种价格体制。由于此前长期忽视价值规律的作用，生产资料实行单一的计划价格，导致价格结构混乱。随着经济体制改革，国家对同一种产品(主要是生产资料),分为计划内和计划外两部分，分别实行国家计划价格和市场价格，由此形成价格双轨制。价格双轨制是中国经济体制由计划经济向市场经济过渡的一种特殊价格管理制度，该体制对促进生产发展、搞活物资流通发挥了重要作用。20世纪90年代后期，逐渐消失。(二)特区建设和“一国两制”",

  "def": "2017年印度军队非法越过中印边界引发的对峙事件。洞朗地区位于中国西藏自治区亚东县，西与印度锡金邦相邻，南与不丹王国相接。2017年6月18日，印度军队270余人，连同2台推土机，在中印边界锡金段非法越过边界线进入中国境内，阻挠中国的基础设施建设。中印双方在边境进行了为期两个月的对峙。8月28日印方将越界人员和设备全部撤回印度境内。中国政府依照国际法准则，和平解决了“洞朗事件”,使中印关系继续向着睦邻友好的路径发展。",
  "time": "2017年",
  "time_bucket": "外交（跨时期）",
  "section": "七、共和国时期的外交",
  "sec_id": "S7",
  "type": "外交",
  "nature": "事件",
  "nature_fine": "事件"
 },
 {
  "term": "《中日联合声明》",
  "alias": "又称《中日两国政府联合声明》、中日建交公报",
  "def": "1972年中日两国共同发表的联合声明。1972年9月日本首相田中角荣访华。9月29日双方发表联合声明，主要内容为：中、日两国间的不正常状态自即日起结束；日本政府承认中华人民共和国政府是中国唯一的合法政府，台湾是中国不可分割的领土；两国决定自即日起建立外交关系；日本对侵略中国表示深刻反省；中国为中、日友好而放弃对日本的战争赔偿要求；日本断绝同台湾的外交关系等。《中日联合声明》揭开了中日两国关系新的一页，对20世纪70年代中国的外交也产生了积极影响。",
  "time": "1972年",
  "time_bucket": "外交（跨时期）",
  "section": "七、共和国时期的外交",
  "sec_id": "S7",
  "type": "外交",
  "nature": "条约·公报",
  "nature_fine": "文件/声明"
 },
 {
  "term": "《中日和平友好条约》",
  "alias": "全称《中华人民共和国和日本国和平友好条约》",
  "def": "1978年中日两国在北京签订的双边条约。1978年8月12日，由中日两国外长在北京签订。同年10月23日起正式生效。条约共5条，主要内容为：双方在和平共处五项原则基础上发展两国间持久的和平友好关系；用和平手段解决一切争端，而不诉诸武力和武力威胁；双方中的任何一方都不谋求霸权并反对任何其他国家或国家集团谋求霸权；进一步发展两国之间的经济、文化关系。《中日和平友好条约》的签订为两国的友好睦邻关系奠定了良好的基础，对稳定亚太地区的局势具有重要意义。",
  "time": "1978年",
  "time_bucket": "外交（跨时期）",
  "section": "七、共和国时期的外交",
  "sec_id": "S7",
  "type": "外交",
  "nature": "条约·公报",
  "nature_fine": "条约"
 },
 {
  "term": "中越边境自卫反击战",
  "alias": "",
  "def": "1979年中国边防部队反击越南侵略的作战。越南统一后，为推行地区霸权主义，在控制老挝和入侵柬埔寨的同时，加紧对中国的挑衅。为保卫边疆的和平与安全，中国云南、广西边防部队奋起反击，从1979年2月17日开始，在16天的战斗中，连续攻下谅山、老街、高平等20多个越南边境城镇和战略要地，给越军以重大打击。中国边防部队在胜利完成自卫反击任务后，于3月5日到16日全部撤回中国境内。中越边境自卫反击战维护了中国的国家主权和领土完整。",
  "time": "1979年",
  "time_bucket": "外交（跨时期）",
  "section": "七、共和国时期的外交",
  "sec_id": "S7",
  "type": "军事",
  "nature": "战争",
  "nature_fine": "战争"
 }
];
const TYPE_ORDER=['政治','经济','外交','军事','文化·教育·科技','法律制度'];
const TIME_ORDER=['1949—1956（过渡时期）','1956—1966（探索时期）','1966—1976（文革时期）','1976—1978（拨乱反正）','1978年以来（改革开放）','文教科技（跨时期）','外交（跨时期）'];
const NAT_ORDER=['会议','运动','事件','战争','政策·路线·战略','制度','法律法规','文件·文献','条约·公报','组织·机构','工程项目','概念·人物'];
const DIM_LABEL={type:'类型',time_bucket:'时间',nature:'词性',section:'章节'};
document.getElementById('total').textContent=DATA.length;

const state={q:'',time:new Set(),type:new Set(),nat:new Set(),l1:'type',l2:'nature'};

function counts(key,arr){arr=arr||DATA;const m={};arr.forEach(d=>{m[d[key]]=(m[d[key]]||0)+1});return m;}
function orderFor(key,arr){
  if(key==='type')return TYPE_ORDER.filter(v=>counts('type',arr)[v]);
  if(key==='time_bucket')return TIME_ORDER.filter(v=>counts('time_bucket',arr)[v]);
  if(key==='nature')return NAT_ORDER.filter(v=>counts('nature',arr)[v]);
  const c=counts(key,arr);
  if(key==='section')return Object.keys(c).sort();
  return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b));
}

/* filter chips */
function buildChips(elId,key,order){
  const el=document.getElementById(elId);const c=counts(key);
  const vals=order?order.filter(v=>c[v]):Object.keys(c).sort((a,b)=>c[b]-c[a]);
  el.innerHTML='';
  vals.forEach(v=>{
    const b=document.createElement('button');b.className='chip';
    b.innerHTML=v+'<span class="n">'+c[v]+'</span>';
    b.onclick=()=>{const set=elId==='f-time'?state.time:elId==='f-type'?state.type:state.nat;
      set.has(v)?set.delete(v):set.add(v);b.classList.toggle('on');render();};
    el.appendChild(b);
  });
}
buildChips('f-time','time_bucket',TIME_ORDER);
buildChips('f-type','type',TYPE_ORDER);
buildChips('f-nat','nature',NAT_ORDER);

/* tier controls */
function renderL1(){document.querySelectorAll('.btn.l1').forEach(b=>b.classList.toggle('active',b.dataset.l1===state.l1));}
function renderL2seg(){
  const seg=document.getElementById('l2seg');seg.innerHTML='';
  const opts=[{k:'none',t:'不细分'}];
  ['type','time_bucket','nature','section'].forEach(k=>{if(k!==state.l1)opts.push({k,t:DIM_LABEL[k]});});
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='btn l2'+(state.l2===o.k?' active':'');
    b.textContent=o.t;b.onclick=()=>{state.l2=o.k;renderL2seg();render();};
    seg.appendChild(b);
  });
}
document.querySelectorAll('.btn.l1').forEach(b=>b.onclick=()=>{
  state.l1=b.dataset.l1;
  if(state.l2===state.l1)state.l2='none';
  renderL1();renderL2seg();render();
});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim();render();});
document.getElementById('reset').onclick=()=>{
  state.q='';state.time.clear();state.type.clear();state.nat.clear();
  document.getElementById('q').value='';
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));render();};

function match(d){
  if(state.time.size&&!state.time.has(d.time_bucket))return false;
  if(state.type.size&&!state.type.has(d.type))return false;
  if(state.nat.size&&!state.nat.has(d.nature))return false;
  if(state.q)return (d.term+d.alias+d.def).indexOf(state.q)>=0;
  return true;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(t){if(!state.q)return esc(t);const i=t.indexOf(state.q);if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<span class="hl">'+esc(t.slice(i,i+state.q.length))+'</span>'+esc(t.slice(i+state.q.length));}

let filtered=[];
function cardHTML(d){
  return '<div class="card" data-i="'+DATA.indexOf(d)+'">'+
    '<div class="term">'+hl(d.term)+'</div>'+
    (d.alias?'<div class="alias">'+hl(d.alias)+'</div>':'')+
    '<div class="tags">'+
      '<span class="tag time">'+d.time+'</span>'+
      '<span class="tag type t-'+d.type+'">'+d.type+'</span>'+
      '<span class="tag nat">'+d.nature+'</span>'+
    '</div></div>';
}
function badgeFor(key,val){
  if(key==='type')return '<span class="badge t-'+val+'" style="background:var(--'+
    ({'政治':'pol','经济':'eco','外交':'dip','军事':'mil','文化·教育·科技':'cul','法律制度':'law'}[val]||'ink')+')">类型</span>';
  if(key==='time_bucket')return '<span class="badge" style="background:#6a5b3e">时间</span>';
  if(key==='nature')return '<span class="badge" style="background:#5b5648">词性</span>';
  return '<span class="badge" style="background:var(--accent2)">章节</span>';
}
function render(){
  filtered=DATA.filter(match);
  document.getElementById('count').textContent=filtered.length+' / '+DATA.length+' 条';
  const list=document.getElementById('list');
  if(!filtered.length){list.innerHTML='<div class="empty">没有匹配的名词，试试调整筛选条件。</div>';return;}

  const p=state.l1;
  const pGroups={};filtered.forEach(d=>{(pGroups[d[p]]=pGroups[d[p]]||[]).push(d);});
  const pKeys=orderFor(p,filtered);
  let html='';
  pKeys.forEach(pk=>{
    const items=pGroups[pk];
    html+='<div class="l1group"><div class="l1head">'+badgeFor(p,pk)+
      '<span class="name">'+esc(pk)+'</span>'+
      '<span class="cnt">'+items.length+' 条</span></div>';
    if(state.l2==='none'){
      html+='<div class="grid">'+items.map(cardHTML).join('')+'</div>';
    }else{
      const s=state.l2;
      const sGroups={};items.forEach(d=>{(sGroups[d[s]]=sGroups[d[s]]||[]).push(d);});
      const sKeys=orderFor(s,items);
      sKeys.forEach(sk=>{
        html+='<div class="l2head">'+esc(sk)+'<span class="cnt">· '+sGroups[sk].length+'</span></div>';
        html+='<div class="grid">'+sGroups[sk].map(cardHTML).join('')+'</div>';
      });
    }
    html+='</div>';
  });
  list.innerHTML=html;
  list.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.i));
}

const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
function openModal(i){
  const d=DATA[i];
  modal.innerHTML='<button class="x" onclick="closeModal()">&times;</button>'+
    '<h2>'+esc(d.term)+'</h2>'+
    (d.alias?'<div class="m-alias">'+esc(d.alias)+'</div>':'')+
    '<div class="m-tags">'+
      '<span class="tag time">'+d.time+'</span>'+
      '<span class="tag type t-'+d.type+'">'+d.type+'</span>'+
      '<span class="tag nat">'+d.nature+'</span></div>'+
    '<div class="m-section">所属章节：'+esc(d.section)+'</div>'+
    '<div class="m-def">'+esc(d.def)+'</div>'+
    '<div class="navrow"><button class="btn" onclick="step(-1)">‹ 上一条</button>'+
      '<button class="btn" onclick="step(1)">下一条 ›</button></div>';
  overlay.classList.add('show');overlay.dataset.cur=i;modal.scrollTop=0;document.body.style.overflow='hidden';
}
function closeModal(){overlay.classList.remove('show');document.body.style.overflow='';}
function step(dir){if(!filtered.length)return;const cur=+overlay.dataset.cur;
  let fi=filtered.findIndex(d=>DATA.indexOf(d)===cur);fi=(fi+dir+filtered.length)%filtered.length;
  openModal(DATA.indexOf(filtered[fi]));}
overlay.onclick=e=>{if(e.target===overlay)closeModal();};
document.addEventListener('keydown',e=>{if(!overlay.classList.contains('show'))return;
  if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});

renderL1();renderL2seg();render();
</script>
</body>
</html>
